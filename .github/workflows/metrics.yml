name: Metrics and project cards
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # weekly; avoids unnecessary GitHub API traffic
permissions:
  contents: write # commits only regenerated statistics and repository cards
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Generate from the public GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }} # short-lived built-in token; never saved
        run: python scripts/cards.py --user Fariscus --projects assets/projects.json --out assets
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: refresh metrics and project cards"
          git push
