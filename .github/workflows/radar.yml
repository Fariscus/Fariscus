name: Charts and banner
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["assets/skills.json", "assets/langmix.json", "scripts/radar.py", "scripts/banner/**", "scripts/dotify.py", ".github/workflows/radar.yml"]
permissions:
  contents: write # commits only regenerated SVG assets in this repository
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/banner/generate.py
      - run: python scripts/dotify.py
      - run: python scripts/radar.py --data assets/skills.json -o assets/radar
      - run: python scripts/radar.py --data assets/langmix.json -o assets/radar-langs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: refresh banner and charts"
          git push
